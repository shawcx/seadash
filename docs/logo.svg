<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="seadash">
  <title>seadash</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#06263a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="badge">
      <circle cx="100" cy="100" r="66"/>
    </clipPath>
  </defs>

  <!-- card: its own background, so it reads on light and dark themes -->
  <rect x="0" y="0" width="640" height="200" rx="28" fill="url(#card)"/>
  <rect x="1.5" y="1.5" width="637" height="197" rx="26.5" fill="none" stroke="#1e3a5f" stroke-width="3"/>

  <!-- emblem: a sunset over the sea, framed by a big "C" -->
  <g transform="translate(20 0)">
  <g clip-path="url(#badge)">
    <rect x="30" y="30" width="140" height="140" fill="#0e2a47"/>
    <circle cx="100" cy="98" r="24" fill="url(#sun)"/>
    <path d="M30 104 C 52 90, 74 90, 96 104 S 140 118, 170 104 L 170 170 L 30 170 Z" fill="url(#sea)"/>
    <path d="M30 128 C 52 116, 74 116, 96 128 S 140 140, 170 128 L 170 170 L 30 170 Z" fill="#1d4ed8" opacity="0.55"/>
  </g>
  <!-- the "C": an open ring around the badge -->
  <path d="M 150.2 57.9 A 76 76 0 1 0 150.2 142.1" fill="none" stroke="url(#word)" stroke-width="12" stroke-linecap="round"/>
  <!-- the "dash": a wave that runs out of the C -->
  <path d="M 146 100 C 156 91, 166 91, 176 100 S 196 109, 206 100" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="246" y="112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-1.5">
    <tspan fill="url(#word)">sea</tspan><tspan fill="#f8fafc">dash</tspan>
  </text>
  <text x="250" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8" letter-spacing="0.5">
    Python's syntax <tspan fill="#fdba74">→</tspan> native C++ speed
  </text>
</svg>
