[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seadash"
version = "0.0.1"
description = "A language with Python's syntax that compiles to C++"
requires-python = ">=3.12"

[project.scripts]
sd = "seadash.cli:main"

[tool.setuptools]
packages = ["seadash"]

[tool.setuptools.package-data]
seadash = ["runtime/*.hpp", "runtime/modules/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
