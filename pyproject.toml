[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seadash"
version = "0.1.0"
description = "A language with Python's syntax that compiles to C++"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Shaw", email = "mshaw.cx@gmail.com" }]
keywords = ["compiler", "c++", "transpiler", "language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/shawcx/seadash"
Repository = "https://github.com/shawcx/seadash"
Issues = "https://github.com/shawcx/seadash/issues"

[project.scripts]
sd = "seadash.cli:main"

[tool.setuptools]
packages = ["seadash", "seadash.stdlib"]

[tool.setuptools.package-data]
seadash = ["runtime/*.hpp", "runtime/modules/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
